x-logging: &journald
  driver: journald

networks:
  hermes-net:
    driver: bridge
    name: hermes-net

volumes:
  hindsight-data:
    name: hindsight

services:
  hermes:
    build:
      context: .
      dockerfile: main/hermes.Dockerfile
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - /opt/data:/opt/data
      - /tmp/data:/tmp/data:rw
      - /opt/hermes-repo:/opt/hermes-repo:ro
      - /opt/workspace:/opt/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_INSECURE=1
      - HERMES_YOLO_MODE=1
    group_add:
      - "999"
    networks:
      - hermes-net
    logging: *journald
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  toolbox:
    build:
      context: .
      dockerfile: main/toolbox.Dockerfile
    container_name: hermes-toolbox
    restart: unless-stopped
    command: sleep infinity
    networks:
      - hermes-net
    logging: *journald
    volumes:
      - /var/data:/var/data:ro
      - /tmp/data:/tmp/data:rw
      - /opt/hermes-repo:/opt/hermes-repo:rw
      - /opt/workspace:/opt/workspace:rw
      - /opt/data:/opt/data:ro
      - /tmp/data/grafana:/tmp/data/grafana:rw
      - /tmp/data/credentials/:/tmp/data/credentials/:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hermes-hindsight
    restart: unless-stopped
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=opencode-go
      - HINDSIGHT_API_LLM_API_KEY=***
      - HINDSIGHT_API_LLM_MODEL=deepseek-v4-flash
      - HINDSIGHT_API_LLM_BASE_URL=https://opencode.ai/zen/go/v1
    env_file:
      - /opt/data/.env
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    networks:
      - hermes-net
    mem_limit: 1G
    logging: *journald
