x-logging: &journald
  driver: journald

services:
  hermes:
    image: nousresearch/hermes-agent:v2026.5.29.2
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - /opt/data:/opt/data
      - /opt/hermes-repo:/opt/hermes-repo:ro
      - /opt/workspace:/opt/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=127.0.0.1
    group_add:
      - "999"
    logging: *journald
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  toolbox:
    build:
      context: .
      dockerfile: toolbox.Dockerfile
    container_name: hermes-toolbox
    restart: unless-stopped
    command: sleep infinity
    logging: *journald
    group_add:
      - "999"
    volumes:
      - /var/data:/var/data:ro
      - /opt/hermes-repo:/opt/hermes-repo:rw
      - /opt/workspace:/opt/workspace:rw
