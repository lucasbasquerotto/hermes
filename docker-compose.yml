x-logging: &journald
  driver: journald

networks:
  hermes-net:
    driver: bridge
    name: hermes-net

services:
  hermes:
    build:
      context: .
      dockerfile: main/hermes.Dockerfile
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - /opt/data:/opt/data
      - /opt/hermes-repo:/opt/hermes-repo:ro
      - /opt/workspace:/opt/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_INSECURE=1
      - HERMES_YOLO_MODE=1
    group_add:
      - "999"
    networks:
      - hermes-net
    logging: *journald
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  toolbox:
    build:
      context: .
      dockerfile: main/toolbox.Dockerfile
    container_name: hermes-toolbox
    restart: unless-stopped
    command: sleep infinity
    networks:
      - hermes-net
    logging: *journald
    volumes:
      - /var/data:/var/data:ro
      - /opt/hermes-repo:/opt/hermes-repo:rw
      - /opt/workspace:/opt/workspace:rw
      - /tmp/data/grafana:/tmp/data/grafana:rw
