networks:
  hermes-net:
    driver: bridge
    name: hermes-net

volumes:
  hermes-hindsight-data:
    name: hermes-hindsight

services:
  hermes:
    build:
      context: .
      dockerfile: main/hermes.Dockerfile
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    expose:
      - "8642"    # gateway API
      - "9119"    # dashboard
    volumes:
      - /opt/data:/opt/data:rw
      - /opt/hermes-repo:/opt/hermes-repo:rw
      - /opt/workspace:/opt/workspace:rw
      - /tmp/data:/tmp/data:rw
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_INSECURE=1
      - HERMES_YOLO_MODE=1
    group_add:
      - "999"
    networks:
      - hermes-net
    logging:
      driver: journald
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  toolbox:
    build:
      context: .
      dockerfile: main/toolbox.Dockerfile
    container_name: hermes-toolbox
    restart: unless-stopped
    command: sleep infinity
    networks:
      - hermes-net
    logging:
      driver: journald
    volumes:
      - /var/data:/var/data:ro
      - /tmp/data:/tmp/data:rw
      - /opt/hermes-repo:/opt/hermes-repo:rw
      - /opt/workspace:/opt/workspace:rw
      - /opt/data:/opt/data:ro
      - /tmp/data/grafana:/tmp/data/grafana:rw
      - /tmp/data/user/:/tmp/data/user/:rw
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:0.7.2
    container_name: hermes-hindsight
    restart: unless-stopped
    expose:
      - "8888"
      - "9999"
    env_file:
      - /opt/data/.env
    volumes:
      - hermes-hindsight-data:/home/hindsight/.pg0
    networks:
      - hermes-net
    mem_limit: 1G
    logging:
      driver: journald
