user root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- Mattermost proxy (host: hermes-mm.nexuslbs.org) ----
    server {
        listen 80;
        server_name hermes-mm.nexuslbs.org;

        # Auto-login redirect: just go to Mattermost and login normally
        location = /mm-login {
            return 302 /;
        }

        # Mattermost API (including WebSocket)
        location /api/ {
            proxy_pass http://hermes-mattermost:8065;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Static assets
        location /static/ {
            proxy_pass http://hermes-mattermost:8065;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Plugins
        location /plugins/ {
            proxy_pass http://hermes-mattermost:8065;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Mattermost SPA paths
        location ~ ^/(login|signup|files|oauth|admin|channels|plots|emoji|hooks|public|_redirect) {
            proxy_pass http://hermes-mattermost:8065;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Root → Mattermost SPA entry point
        location / {
            proxy_pass http://hermes-mattermost:8065;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ---- File server (host: hermes-files.nexuslbs.org + default fallback) ----
    server {
        listen 80 default_server;
        server_name hermes-files.nexuslbs.org _;

        root /mnt/host;

        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        sub_filter '</head>' '
<style>
  body{background:#0d1117;color:#e6edf3;font-size:16px;max-width:900px;margin:0 auto;padding:20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;line-height:1.6}
  a{color:#58a6ff}
  h1{border-bottom:1px solid #30363d;padding-bottom:.3em}
  hr{border:0;border-top:1px solid #30363d}
  pre{font-size:16px}
  table{border-collapse:collapse}
  td,th{padding:6px 13px;border:1px solid #30363d}
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"></head>';
        sub_filter_once on;

        location = /favicon.ico {
            alias /etc/nginx/favicon.ico;
            add_header Cache-Control "public, max-age=86400";
            types { } default_type image/svg+xml;
        }

        location = /favicon.svg {
            alias /etc/nginx/favicon.ico;
            add_header Cache-Control "public, max-age=86400";
            types { } default_type image/svg+xml;
        }

        location ~ \.md$ {
            try_files $uri =404;
            content_by_lua_file /etc/nginx/markdown.lua;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
