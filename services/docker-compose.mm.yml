networks:
  hermes-net:
    external: true
    name: hermes-net

volumes:
  hermes-mm-db-vol:
    name: hermes-mm-db
  hermes-mm-config-vol:
    name: hermes-mm-config
  hermes-mm-data-vol:
    name: hermes-mm-data
  hermes-mm-logs-vol:
    name: hermes-mm-logs
  hermes-mm-plugins-vol:
    name: hermes-mm-plugins

services:
  mattermost-db:
    image: postgres:16.14
    container_name: hermes-mm-db
    restart: unless-stopped
    env_file:
      - /opt/data/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - hermes-mm-db-vol:/var/lib/postgresql/data:rw
    networks:
      - hermes-net
    mem_limit: 256M
    logging:
      driver: journald
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mattermost:
    image: mattermost/mattermost-team-edition:10.11.20
    container_name: hermes-mattermost
    restart: unless-stopped
    env_file:
      - /opt/data/.env
    depends_on:
      mattermost-db:
        condition: service_healthy
    expose:
      - "8065"
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: ${MM_SQLSETTINGS_DRIVERNAME}
      MM_SQLSETTINGS_DATASOURCE: ${MM_SQLSETTINGS_DATASOURCE}
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL}
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: ${MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION}
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: ${MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS}
    volumes:
      - hermes-mm-config-vol:/mattermost/config:rw
      - hermes-mm-data-vol:/mattermost/data:rw
      - hermes-mm-logs-vol:/mattermost/logs:rw
      - hermes-mm-plugins-vol:/mattermost/plugins:rw
    networks:
      - hermes-net
    mem_limit: 1G
    logging:
      driver: journald
