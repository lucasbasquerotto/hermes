networks:
  hermes-net:
    external: true
    name: hermes-net

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.5.2
    container_name: hermes-tunnel
    restart: unless-stopped
    env_file:
      - /opt/data/credentials/tunnel.env
    command: tunnel --no-autoupdate run
    networks:
      - hermes-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: journald
    mem_limit: 1G
