services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hermes-tunnel
    restart: unless-stopped
    env_file:
      - /opt/data/credentials/tunnel.env
    command: tunnel --no-autoupdate run
    networks:
      - hermes-net

networks:
  hermes-net:
    external: true
    name: hermes-net
